<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080f17"><title>Teamflow · Offline</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:32px;background:radial-gradient(ellipse at 20% 0%,#244c7133,transparent 60%),#080f17;color:#eaf3ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.card{max-width:420px;padding:32px;border:1px solid #aacfff30;border-radius:25px;background:linear-gradient(130deg,#a0c8f513,#96c0f807);box-shadow:inset 0 1px #ffffff15}small{color:#8eb5df;font-size:11px;letter-spacing:2px}h1{font-size:30px;line-height:1.2;letter-spacing:-1px;font-weight:500}p{font-size:14px;line-height:1.8;color:#a6b8cc}button{padding:14px 20px;min-height:48px;border:1px solid #8bbaff60;border-radius:12px;background:#4c8ee528;color:#eaf3ff;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #8bbaff;outline-offset:4px}</style></head><body><main class="card"><small>TEAMFLOW</small><h1>Wir verbinden uns gleich wieder.</h1><p>Bitte prüfe deine Internetverbindung. Der gemeinsame Teamstand, Videomeetings und Dateien benötigen eine Verbindung. Bereits gesicherte lokale Änderungen bleiben auf diesem Gerät erhalten.</p><button onclick="location.reload()">Erneut verbinden</button></main></body></html>
